overrides:
  # GHSA-w9m9-85wc-3x92: keep Tailwind's selector parser on patched 6.x.
  "postcss-selector-parser@>=6.1.0 <6.1.3": "6.1.3"
  # GHSA-2883-xcg3-v3hh raised the patched floor past the 4.3.1 this override
  # previously pinned, so the override's own target became vulnerable. Widen
  # the range key and the target together — same maintenance pattern as undici
  # below.
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  # nanoid is transitive under tailwindcss → postcss (13 paths). GHSA-2v37-7h3g-55p8
  # names `<3.3.17`; 3.3.18 is the current 3.x patch. Range key rather than an
  # exact-version key: postcss resolves nanoid on its own and the naturally
  # resolved version moves with it.
  "nanoid@<3.3.17": "^3.3.18"
  # undici is transitive under jsdom (vitest's DOM environment). The range key
  # is widened each time a new advisory raises the patched floor; 7.29.0 clears
  # GHSA-4cwx-7wf7-3272 / -8xcm-r25x-g524 / -m8rv-5g2x-5cg5 / -jr45-8vmc-qm54 /
  # -v3r7-h72x-cjcm, all of which name `>=7.0.0 <7.29.0` and so caught the
  # 7.28.0 this override previously pinned.
  "undici@>=7.23.0 <7.29.0": "^7.29.0"
  # GHSA-rgw5-rvv9-x895 (brace-expansion DoS via unbounded intermediate
  # arrays — a bypass of the GHSA-mh99-v99m-4gvg mitigation below). All three
  # maintenance lines now ship a real patched version (1.1.18 / 2.1.4 /
  # 5.0.9), unlike when GHSA-mh99-v99m-4gvg first landed, so all three
  # parents (minimatch@3 → 1.x, minimatch@5 → 2.x, minimatch@10 → 5.x) are
  # bumped in place rather than suppressed. Exact-version keys (matching the
  # naturally-resolved version), same style as before — a `<range>` key was
  # tried first and mis-cascaded, pulling brace-expansion 5.x onto
  # minimatch@3/5, which breaks the CJS export minimatch@3 needs.
  "brace-expansion@1.1.16": "1.1.18"
  "brace-expansion@2.1.2": "2.1.4"
  "brace-expansion@5.0.7": "5.0.9"
