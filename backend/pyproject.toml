[project]
name = "thought2build-backend"
version = "0.1.0"
description = "FastAPI backend for Thought2Build V1."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136,<0.140",
    "starlette==1.3.*",
    "uvicorn[standard]==0.32.*",
    "gunicorn==23.*",
    "sqlalchemy[asyncio]==2.0.*",
    "alembic==1.14.*",
    "asyncpg==0.30.*",
    "supabase==2.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "python-dotenv==1.*",
    "authlib==1.*",
    "pyjwt[crypto]==2.*",
    "passlib==1.*",
    "anthropic>=0.40,<0.118",
    "openai>=2.0,<3.0",
    "google-genai>=1,<3",
    "cryptography>=50,<51",
    "bleach==6.*",
    "resend==2.*",
    "redis[asyncio]==5.*",
    "opentelemetry-api==1.*",
    "opentelemetry-sdk==1.*",
    "opentelemetry-instrumentation-fastapi==0.49.*",
    "opentelemetry-instrumentation-sqlalchemy==0.49.*",
    "opentelemetry-exporter-otlp==1.*",
    "prometheus-client==0.21.*",
    "structlog==24.*",
    "sentry-sdk[fastapi]==2.*",
    "httpx==0.28.*",
    "python-multipart==0.0.*",
    "langfuse>=2.60,<3",
    "weasyprint==69.*",
    "jinja2==3.*",
    "pygments==2.*",
    "markdown==3.*",
    "arq>=0.28.0",
]

[project.optional-dependencies]
# Used by backend/scripts/rotate_encryption_key.py for direct DB access during
# key rotation.  Not required at runtime (the app uses asyncpg via SQLAlchemy).
scripts = ["psycopg2-binary>=2.9"]

[dependency-groups]
dev = [
    "bandit==1.*",
    "pip-audit==2.*",
    "pytest==9.*",
    "pytest-asyncio==1.*",
    "pytest-cov>=6,<8",
    "black==26.*",
    "ruff==0.8.*",
    "pytest-mock",
    "aiosqlite>=0.22.1",
]

[tool.uv]
package = false

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Prompt bodies are markdown tables / prose inside triple-quoted f-strings.
# Reflowing them changes the LLM prompt bytes (would trip the Phase-19 eval and
# the ASDD_PROMPT_VERSION gate), and a line inside a triple-quoted block cannot
# carry an inline `# noqa`, so E501 is ignored for the whole prompts package.
"prompts/*.py" = ["E501"]

# Importing a pytest fixture from another test module is how a fixture is shared
# without moving it into conftest; the parameter of each test that consumes it
# then legitimately shadows the imported name, which F811 reads as a redefinition.
"tests/test_github_sync_recovery.py" = ["F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a real PostgreSQL and Redis instance (skipped when TEST_DATABASE_URL is unset)",
]
