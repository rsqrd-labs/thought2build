name: prompt-eval

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/prompts/**"
      - "backend/services/pipeline/**"
      - "backend/services/llm/**"
      - "backend/config.py"
      - "backend/worker.py"
      - "harness/prompt_eval/**"
      - "docs/evals/golden_prompts/**"
      - ".github/workflows/prompt-eval.yml"

# Cancel superseded fixture and live candidate evaluations.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  prompt-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check ASDD_PROMPT_VERSION bump
        id: version_check
        run: |
          git fetch origin main --depth=1
          if git diff --quiet origin/main...HEAD -- backend/prompts/; then
            echo "Prompt sources unchanged; evaluation-only change does not require a version bump."
            exit 0
          fi
          OLD=$(git show origin/main:backend/prompts/base.py | grep -oE 'ASDD_PROMPT_VERSION = "asdd-v[0-9.]+"' || true)
          NEW=$(grep -oE 'ASDD_PROMPT_VERSION = "asdd-v[0-9.]+"' backend/prompts/base.py)
          if [ "$OLD" = "$NEW" ]; then
            echo "::error::Prompt files changed but ASDD_PROMPT_VERSION not bumped"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Same pinned, cache-enabled action the CI workflow uses, rather than a
      # bare `pip install uv` + uncached resolve: this job downloads the whole
      # backend dependency set cold on every run.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --project backend

      - name: Grade committed fixtures (offline; not candidate quality)
        run: |
          cd harness
          uv run --project ../backend python -m prompt_eval.run \
            --version "$(sed -n 's/^ASDD_PROMPT_VERSION = \"\(asdd-v[0-9.]*\)\"/\1/p' ../backend/prompts/base.py)" \
            --baseline asdd-v1.8.0 \
            --report ../prompt_eval_report.md

      - name: Comment report on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        with:
          path: prompt_eval_report.md

  generated-prompt-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql+asyncpg://unused:unused@127.0.0.1:1/unused
      REDIS_URL: redis://127.0.0.1:1/0
      JWT_PRIVATE_KEY: eval-unused
      JWT_PUBLIC_KEY: eval-unused
      GOOGLE_CLIENT_ID: eval-unused
      GOOGLE_CLIENT_SECRET: eval-unused
      FRONTEND_URL: http://localhost:5173
      ENCRYPTION_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CSRF_SECRET: eval-only-secret-not-used-for-authentication
      ENVIRONMENT: test
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: baseline
      # Only a change to the prompt SOURCES can change what the pipeline
      # generates, so only such a change needs live candidate evidence. This
      # job's path filter is deliberately much wider than that (all of
      # services/pipeline, services/llm, config.py, worker.py), which is the
      # right question for "might this be prompt-affecting?" but the wrong
      # trigger for a gate that hard-fails when provider secrets are absent: a PR
      # touching only, say, the GitHub export orchestrator would then be blocked
      # with no green path available to it.
      #
      # Compared with git against the PR's OWN base sha — not `origin/main`,
      # which is not the base of a stacked PR — and only over tracked content, so
      # a stray __pycache__ or other untracked artifact in either tree cannot
      # silently flip this to "changed" and re-block the PR. Outside a PR
      # (workflow_dispatch) there is no base to compare, so the gate runs: the
      # safe default is evidence required, never evidence skipped.
      - name: Detect prompt-source changes
        id: prompts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No PR base to compare against; requiring live candidate evidence."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          if git diff --quiet "$BASE_SHA" HEAD -- backend/prompts/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Prompt sources identical to the PR base; skipping live generation."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Prompt sources changed; live candidate evidence is required."
          fi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        if: steps.prompts.outputs.changed == 'true'
        with:
          version: "0.11.8"
          enable-cache: true
      - if: steps.prompts.outputs.changed == 'true'
        run: uv sync --project backend
      - name: Generate both revisions with a bounded call count
        if: steps.prompts.outputs.changed == 'true'
        # Missing keys fail this gate, including fork PRs. They require a trusted
        # evaluation run; absence of candidate evidence is never a quality pass.
        run: |
          uv run --project backend python - <<'PY'
          import os, subprocess, sys
          if not any(os.environ.get(k) for k in ('ANTHROPIC_API_KEY', 'OPENAI_API_KEY', 'GOOGLE_API_KEY')):
              raise SystemExit('Live candidate evidence required: configure evaluation provider secrets on a trusted run.')
          failures = []
          for label, root in [('baseline', 'baseline/backend'), ('candidate', 'backend')]:
              proc = subprocess.run([sys.executable, 'harness/prompt_eval/live.py',
                  '--allow-live', '--code-root', root, '--output', f'eval-results/{label}.json',
                  '--max-provider-calls', '100'])
              if proc.returncode:
                  failures.append(label)
          if failures:
              raise SystemExit(f'Generation failed: {failures}; inspect eval-results.')
          PY
      - name: Compare actual generated packages
        if: steps.prompts.outputs.changed == 'true'
        run: >-
          uv run --project backend python harness/prompt_eval/compare_live.py
          --candidate eval-results/candidate.json --baseline eval-results/baseline.json
      - name: Preserve reviewable prompts, outputs, and provider attempts
        if: always() && steps.prompts.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-prompt-evidence
          path: eval-results/
          retention-days: 14
