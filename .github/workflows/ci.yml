name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref so a burst of pushes to a PR branch
# does not pile up parallel full-CI runs. Never cancel on main: a cancelled
# deploy could leave a half-shipped release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read
  # Needed by the `preflight` job to read the CI conclusion of the PR run that
  # already validated this tree (see "Detect a tree already verified on its PR").
  actions: read

jobs:
  # One cheap gate job for everything that must run on every single push: the
  # secret scan, the immutable-action-ref check, the changed-path filter, and
  # the already-verified short-circuit. These were previously two separate jobs
  # (`changes` + `secrets`) doing ~7s and ~16s of real work; GitHub bills each
  # job rounded UP to the minute, so splitting them cost a full extra billable
  # minute on every run for no parallelism benefit. Keep them fused.
  #
  # Outputs come in two flavours, and the distinction matters:
  #   backend/frontend/marketing        — did this area's SOURCE change? Used by
  #                                       `deploy` to decide what to ship.
  #   docker                            — did a real `docker build` INPUT change?
  #                                       Same flavour as the above (never
  #                                       suppressed by `verified`), but a much
  #                                       narrower path set than `backend`; see
  #                                       the filter and the `worker-image` job.
  #   test_backend/_frontend/_marketing — should this area's SUITE run? Same as
  #                                       above, except forced false when the
  #                                       tree was already validated green.
  # `.github/workflows/ci.yml` is listed in every filter, so a workflow change
  # always re-runs everything.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.gate.outputs.backend }}
      frontend: ${{ steps.gate.outputs.frontend }}
      marketing: ${{ steps.gate.outputs.marketing }}
      docker: ${{ steps.gate.outputs.docker }}
      test_backend: ${{ steps.gate.outputs.test_backend }}
      test_frontend: ${{ steps.gate.outputs.test_frontend }}
      test_marketing: ${{ steps.gate.outputs.test_marketing }}
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TruffleHog scans the base..head range, and the already-verified
          # check below resolves the merged PR head's tree object.
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

      - name: Enforce immutable GitHub Action references
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          invalid = []
          pattern = re.compile(r"^\s*uses:\s*[^#\s]+@([^#\s]+)", re.MULTILINE)
          for workflow in pathlib.Path(".github/workflows").glob("*.yml"):
              for ref in pattern.findall(workflow.read_text()):
                  if not re.fullmatch(r"[0-9a-f]{40}", ref):
                      invalid.append(f"{workflow}: @{ref}")
          if invalid:
              raise SystemExit("Mutable action references:\n" + "\n".join(invalid))
          PY

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'harness/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'harness/**'
              - '.github/workflows/ci.yml'
            marketing:
              - 'apps/marketing/**'
              - '.github/workflows/ci.yml'
            # Inputs that can actually break `docker build ./backend`. The
            # Dockerfile never executes or byte-compiles application code — it
            # is COPY + `uv sync --frozen --no-dev` + chmod/useradd/chown — so a
            # Python source edit cannot fail the image build, and gating
            # `worker-image` on all of backend/** paid a full billable minute on
            # ~110 main pushes a month to rebuild a provably unchanged image.
            docker:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'backend/entrypoint.sh'
              - '.github/workflows/ci.yml'

      # Merging a PR ran the full suite twice: once on `pull_request`, then
      # again on the resulting `push` to main against byte-identical code. This
      # step kills the second run — but ONLY on proof, never on a heuristic:
      # the merge commit's git TREE object must be identical to the tree of the
      # PR head commit, AND that head SHA's own CI run must have concluded
      # `success`. Identical trees mean the checkout the suites would see is
      # bit-for-bit what already passed, so re-running cannot produce a
      # different verdict. A stale branch, a squash that picked up new base
      # commits, a conflict resolution, or a direct push to main all change the
      # tree and fall through to a full run.
      #
      # Deliberately fail-safe: ANY uncertainty (no linked PR, unfetchable head,
      # API hiccup, non-success conclusion) leaves verified=false and runs
      # everything. `deploy` is NOT gated on this — a verified merge still
      # deploys, it just doesn't re-test.
      - name: Detect a tree already verified on its PR
        id: verified
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          verdict=false
          reason="no merged PR is associated with this commit"

          pr=$(gh api "/repos/${REPO}/commits/${SHA}/pulls" \
                 --jq '[.[] | select(.merged_at != null)] | first | .number // empty' 2>/dev/null || true)
          if [ -n "${pr}" ]; then
            head=$(gh api "/repos/${REPO}/pulls/${pr}" --jq '.head.sha // empty' 2>/dev/null || true)
            git fetch --no-tags --quiet origin "+refs/pull/${pr}/head:refs/remotes/verified/pr" 2>/dev/null || true
            if [ -n "${head}" ] && git cat-file -e "${head}^{commit}" 2>/dev/null; then
              main_tree=$(git rev-parse "${SHA}^{tree}")
              pr_tree=$(git rev-parse "${head}^{tree}")
              if [ "${main_tree}" = "${pr_tree}" ]; then
                concl=$(gh api "/repos/${REPO}/actions/runs?head_sha=${head}&event=pull_request&per_page=100" \
                          --jq '[.workflow_runs[] | select(.name == "CI")] | first | .conclusion // empty' 2>/dev/null || true)
                if [ "${concl}" = "success" ]; then
                  verdict=true
                  reason="tree ${main_tree} already passed CI on PR #${pr} (${head})"
                else
                  reason="PR #${pr} CI conclusion was '${concl:-unknown}', not success"
                fi
              else
                reason="merge tree ${main_tree} differs from PR #${pr} head tree ${pr_tree}"
              fi
            else
              reason="could not resolve the head commit of PR #${pr}"
            fi
          fi

          echo "verified=${verdict}" >> "$GITHUB_OUTPUT"
          if [ "${verdict}" = "true" ]; then
            echo "::notice::Skipping re-test on main — ${reason}."
          else
            echo "Running the full suite — ${reason}."
          fi

      - name: Resolve job gates
        id: gate
        env:
          CHANGED_BACKEND: ${{ steps.filter.outputs.backend }}
          CHANGED_FRONTEND: ${{ steps.filter.outputs.frontend }}
          CHANGED_MARKETING: ${{ steps.filter.outputs.marketing }}
          CHANGED_DOCKER: ${{ steps.filter.outputs.docker }}
          VERIFIED: ${{ steps.verified.outputs.verified }}
        run: |
          set -euo pipefail
          {
            echo "backend=${CHANGED_BACKEND}"
            echo "frontend=${CHANGED_FRONTEND}"
            echo "marketing=${CHANGED_MARKETING}"
            echo "docker=${CHANGED_DOCKER}"
          } >> "$GITHUB_OUTPUT"
          if [ "${VERIFIED:-false}" = "true" ]; then
            {
              echo "test_backend=false"
              echo "test_frontend=false"
              echo "test_marketing=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "test_backend=${CHANGED_BACKEND}"
              echo "test_frontend=${CHANGED_FRONTEND}"
              echo "test_marketing=${CHANGED_MARKETING}"
            } >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: preflight
    if: needs.preflight.outputs.test_backend == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      # Keep uv's virtualenv outside backend/ so source-scanning harness tests
      # do not walk dependency files under backend/.venv.
      UV_PROJECT_ENVIRONMENT: ../.venv/backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install WeasyPrint native dependencies (T-USE-07)
        # WeasyPrint requires libcairo, libpango, libgobject. Without these the
        # Phase 14 PDF export service raises OSError at import time and the
        # `test_pdf_export_service.py` suite skips at the module level.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libffi8 \
            fonts-dejavu

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Generate test JWT keypair
        # Some backend tests exercise real RS256 auth paths. Generate a fresh
        # throwaway keypair in CI so those paths use valid PEM without storing
        # a private key in the repository.
        run: |
          uv run python - <<'PY' >> "$GITHUB_ENV"
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          private_key = rsa.generate_private_key(
              public_exponent=65537,
              key_size=2048,
          )
          private_pem = private_key.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.TraditionalOpenSSL,
              encryption_algorithm=serialization.NoEncryption(),
          ).decode("utf-8")
          public_pem = private_key.public_key().public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo,
          ).decode("utf-8")

          for name, value in (
              ("JWT_PRIVATE_KEY", private_pem),
              ("JWT_PUBLIC_KEY", public_pem),
          ):
              print(f"{name}<<__THOUGHT2BUILD_CI_JWT_KEY__")
              print(value, end="")
              print("__THOUGHT2BUILD_CI_JWT_KEY__")
          PY

      - name: Apply database migrations
        run: |
          echo "::group::Reset test database"
          uv run python scripts/reset_test_database.py
          echo "::endgroup::"
          echo "::group::Alembic migrate"
          uv run alembic upgrade head
          echo "::endgroup::"
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Bandit
        run: uv run bandit -r config.py database.py main.py middleware models prompts routers schemas services

      - name: Python dependency audit
        # No advisories are suppressed: the previously-acknowledged PYSEC-2026-161
        # (starlette < 1.0.1) no longer applies now that starlette is on 1.3.x.
        # Any advisory must fail CI; fix by bumping the affected dependency.
        run: uv run pip-audit --strict

      - name: Pytest
        # These schema-owning integration modules call Alembic reset helpers or
        # Base.metadata.drop_all against TEST_DATABASE_URL. Keep them out of the
        # shared backend suite so one module cannot drop/mutate the schema for
        # later tests in the same pytest process.
        run: >-
          uv run pytest tests/
          --ignore=tests/test_billing_migration_0018.py
          --ignore=tests/test_finalise_integration.py
          --ignore=tests/test_storyboard_service.py
          --ignore=tests/test_storyboard_source_integration.py
          --ignore=tests/test_storyboard_router_integration.py
          --ignore=tests/test_storyboard_public_service.py
          --cov=services
          --cov-fail-under=80
          -q
        env:
          # coverage.py drives its line tracing off CPython 3.12's sys.monitoring
          # API instead of the legacy settrace callback. Pytest is ~70% of this
          # job (231s of 330s) and coverage instrumentation is most of that
          # overhead: measured locally on the full suite, 127.3s -> 73.9s (-42%).
          #
          # Verified equivalent before adopting, because the --cov-fail-under=80
          # gate depends on it: same test outcomes, and the per-file coverage
          # table plus the TOTAL line are byte-identical between the two cores.
          # This is safe here specifically because the run is LINE coverage only
          # (no --cov-branch, and there is no [tool.coverage] branch config) —
          # sysmon + branch coverage is not supported on 3.12. If branch
          # coverage is ever switched on, drop this variable.
          COVERAGE_CORE: sysmon
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      # Dedicated step for the schema-owning finalise concurrency suite
      # (issue #83 / BE29-003): it runs OUTSIDE the shared pytest process so
      # its Base.metadata.drop_all cannot clobber other modules. Its engine
      # fixture resets its own tables at setup (so leftover rows from the
      # main suite above never leak in), and the "Reset database after full
      # pytest" step below restores the Alembic schema for the harness step.
      - name: Finalise PostgreSQL concurrency integration (issue #83)
        run: uv run pytest tests/test_finalise_integration.py -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Reset database after full pytest
        run: |
          echo "::group::Reset test database"
          uv run python scripts/reset_test_database.py
          echo "::endgroup::"
          echo "::group::Alembic migrate"
          uv run alembic upgrade head
          echo "::endgroup::"
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      # The COMPLETE backend harness directory is the authoritative contract
      # target (issue #84): every harness/tests/backend module runs here, so a
      # new or drifted contract test can never silently rot outside CI. The
      # documented local command (`pytest tests/backend/ -q` from harness/) is
      # therefore exactly what CI enforces; the whole directory runs in under
      # ten seconds. test_harness_inventory.py (inside the directory) fails if
      # this step is ever narrowed back to a subset.
      - name: Complete backend harness contracts (authoritative — issue #84)
        run: uv run pytest ../harness/tests/backend -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Harness JSON schemas are well-formed
        run: |
          python3 -m json.tool ../harness/schemas/llm-cost-event.schema.json >/dev/null
          python3 -m json.tool ../harness/schemas/integration-push.schema.json >/dev/null
          python3 -m json.tool ../harness/schemas/public-workspace.schema.json >/dev/null
          python3 -m json.tool ../harness/schemas/template.schema.json >/dev/null

      # NOTE: tests/test_github_integration.py, test_github_api_client.py and
      # test_task_parser.py, plus the per-feature V1.3 unit modules
      # (test_spec_clarifier, test_pdf_export_service, test_public_share_service,
      # test_online_eval_task_fields, test_seed_templates), all run inside the
      # main Pytest step above. The per-phase harness re-run steps that used to
      # live here were folded into the single authoritative step (issue #84).

  worker-image:
    name: Worker Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    # The Dockerfile rarely changes and the build is uncached (slow). PRs skip
    # it always; main only builds it when a real BUILD INPUT changed.
    #
    # Gated on `docker`, not `backend`: the build is COPY + `uv sync --frozen
    # --no-dev` + chmod/useradd/chown and never executes or byte-compiles app
    # code, so editing a .py file cannot change the build's outcome. Rebuilding
    # on all of backend/** spent a full billable minute on ~110 main pushes a
    # month re-proving an image whose inputs had not moved. See the `docker`
    # filter in `preflight` for the exact input set.
    #
    # Still gated on the raw `docker` output, NOT a test_-prefixed one: PR runs
    # never build this image, so an already-verified merge has no prior image
    # build to reuse and must still prove the worker image is deployable before
    # main ships.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.preflight.outputs.docker == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The durable bulk/generation and fast worker lanes share this backend
      # image (same image, different start command; compose `worker` and
      # `worker-fast`). Building it here proves the image is deployable
      # before main is allowed to ship.
      - name: Build backend / worker image
        run: docker build -t thought2build-worker:ci ./backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: preflight
    if: needs.preflight.outputs.test_frontend == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: frontend_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/frontend_e2e
      REDIS_URL: redis://127.0.0.1:6379/1
      GOOGLE_CLIENT_ID: frontend-e2e-client
      GOOGLE_CLIENT_SECRET: frontend-e2e-secret
      FRONTEND_URL: http://127.0.0.1:4173
      VITE_API_URL: http://127.0.0.1:8000
      E2E_API_URL: http://127.0.0.1:8000
      ANTHROPIC_API_KEY: e2e-disabled-anthropic
      OPENAI_API_KEY: e2e-disabled-openai
      GOOGLE_API_KEY: e2e-disabled-google
      ENCRYPTION_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CSRF_SECRET: frontend-e2e-csrf-secret-long-enough
      ENVIRONMENT: test
      PAYMENTS_ENABLED: "false"
      UV_PROJECT_ENVIRONMENT: ../.venv/backend
      # Headroom for the concurrent authenticated journeys below. Measured
      # against the real stack (3 browser projects, `--workers=3`): the suite
      # peaks at exactly 3 simultaneous in-flight generations, against a
      # per-user admission ceiling whose production default is exactly 3.
      # It passes there — with ZERO headroom. That is a latent flake, not a
      # working configuration: one lease released a few ms late, one Playwright
      # retry overlapping a still-draining generation, or a slower runner puts
      # the 4th acquire over the ceiling and fails the journey. Buy margin.
      #
      # This relaxes ONLY the per-user lease. The per-process limiter (20), the
      # provider budget, and every other admission path keep their defaults and
      # stay exercised, and admission rejection has its own backend tests — so
      # no coverage is traded away for the margin.
      MAX_CONCURRENT_GENERATIONS_PER_USER: "12"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # pnpm 9/10 use npm's retired audit endpoint and now fail with HTTP
          # 410 before typecheck/tests. pnpm 11 uses the supported bulk API.
          version: 11.13.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Set up uv for OpenAPI drift check
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          # This job also `uv sync`s the backend to boot the deterministic E2E
          # API; without the cache that resolve+download runs cold every time.
          enable-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Docker-backed browser API
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python - <<'PY' >> "$GITHUB_ENV"
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          private_pem = key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.TraditionalOpenSSL,
              serialization.NoEncryption(),
          ).decode()
          public_pem = key.public_key().public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          ).decode()
          for name, value in (("JWT_PRIVATE_KEY", private_pem), ("JWT_PUBLIC_KEY", public_pem)):
              print(f"{name}<<__E2E_KEY__")
              print(value, end="")
              print("__E2E_KEY__")
          PY

      - name: Migrate, seed, and start deterministic browser API
        working-directory: backend
        run: |
          uv run alembic upgrade head
          echo "E2E_ACCESS_TOKEN=$(uv run python -m scripts.seed_frontend_e2e)" >> "$GITHUB_ENV"
          nohup uv run python -m scripts.run_frontend_e2e_generation_worker > /tmp/thought2build-e2e-generation-worker.log 2>&1 &
          generation_worker_pid=$!
          nohup uv run python -m scripts.run_frontend_e2e_server > /tmp/thought2build-e2e-api.log 2>&1 &
          api_pid=$!
          for attempt in $(seq 1 30); do
            if ! kill -0 "$generation_worker_pid" 2>/dev/null; then
              cat /tmp/thought2build-e2e-generation-worker.log
              exit 1
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/thought2build-e2e-api.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/thought2build-e2e-api.log
          cat /tmp/thought2build-e2e-generation-worker.log
          exit 1

      - name: Audit
        run: pnpm audit --audit-level moderate

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      # Coverage runs the full vitest suite with the coverage ratchet, so a
      # separate plain `vitest run` would just execute the same tests twice.
      - name: Vitest (with coverage ratchet)
        run: pnpm test:coverage -- --passWithNoTests

      # `vitest.harness.config.ts` includes every file under
      # harness/tests/frontend/**, so this one step is already authoritative
      # for all phase contract suites (13, 14, 15, 23, 24, 25, ...) — mirrors
      # the backend's issue #84 consolidation. Do not re-add a per-phase step;
      # that would just re-run a file this step already covers.
      - name: Complete frontend harness
        run: pnpm test:harness

      - name: OpenAPI contract drift
        run: pnpm check:api

      - name: Build
        run: pnpm build

      # CI runs the 3 core e2e projects (chromium, webkit, iphone). iphone is an
      # iPhone-13 device profile on the webkit engine, so only chromium + webkit
      # binaries are needed — firefox (desktop Gecko) and android (Pixel 7 on the
      # chromium engine, redundant with chromium+iphone) are dropped from CI.
      # The full 5-project matrix in playwright.config.ts still runs locally.
      #
      # PRs run a 2-project subset — chromium + iphone — which still covers BOTH
      # rendering engines (iphone is the webkit engine) plus the mobile viewport
      # that has historically broken. Desktop webkit only adds a third viewport
      # on an engine already under test, and the authenticated journeys run
      # `--workers=1` (the seeded user's admission ceiling is 3 concurrent
      # generations, so the projects cannot safely run in parallel), which makes
      # every extra project a straight ~2 minutes of serial wall-clock. Push to
      # main restores the full 3-project matrix before anything ships.
      - name: Select e2e project matrix
        id: e2e-projects
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "args=--project=chromium --project=webkit --project=iphone" >> "$GITHUB_OUTPUT"
          else
            echo "args=--project=chromium --project=iphone" >> "$GITHUB_OUTPUT"
          fi

      # Browser binaries are versioned by @playwright/test, NOT by the rest of
      # the lockfile. Keying this 355MB cache on hashFiles(pnpm-lock.yaml) threw
      # it away on every unrelated dependency bump — four distinct 355MB entries
      # existed simultaneously from dependabot churn. Each miss cost 74s to
      # refetch AND pushed the repo toward its 10GB cache ceiling, whose LRU
      # eviction then makes OTHER caches (the 165MB pnpm store) miss as well.
      # Resolve the installed version and key on that, so the cache turns over
      # only when the browsers actually change.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-webkit-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      # Invoke playwright directly (not via the `pnpm test:e2e` script): pnpm
      # forwards the `--` separator into the command, so `playwright test --
      # --project=x` treats the flags as positional test-file filters and the
      # project selection is silently ignored (all 5 projects run, incl. the
      # firefox binary we no longer install → hard fail).
      #
      # `--workers=3` for the same reason as the authenticated journeys below,
      # but with none of their constraints: this step runs only
      # `public-routes.spec.ts` (the authenticated file self-skips on the empty
      # `E2E_ACCESS_TOKEN`), which is frontend-only — its single API call is
      # intercepted by `page.route`, so there is no backend, no session, no
      # shared state, and no admission ceiling to respect. Left on Playwright's
      # default the runner resolved it to ONE worker and spent 114s running 15
      # tests serially (7.6s each). Measured locally: 22.5s @ 1 worker → 15.2s
      # @ 3, green on repeat runs. Keep `--workers` ≥ the project count.
      - name: Browser, mobile, and accessibility gates
        run: E2E_ACCESS_TOKEN= pnpm exec playwright test --workers=3 ${{ steps.e2e-projects.outputs.args }}

      # The single most expensive step in CI: 347s of a 801s job on a 2-project
      # PR run, ~520s on the 3-project push run, because it used to be pinned to
      # `--workers=1`. That pin existed because the seeded user's admission
      # ceiling is 3 concurrent generations — but the ceiling is a plain setting
      # (config.py `max_concurrent_generations_per_user`), so the job env raises
      # it instead and the projects now run concurrently. ~347s -> ~174s (the
      # cost of ONE project), with the full browser matrix still covered.
      #
      # Three properties make this safe, all verified in the E2E server/spec
      # rather than assumed:
      #   1. `run_frontend_e2e_server.py` already replaces RateLimitMiddleware
      #      .dispatch wholesale, so no HTTP rate tier is in play here.
      #   2. Its deterministic provider's only delay is `await asyncio.sleep(10.5)`
      #      — I/O-bound, not CPU. N concurrent streams cost what 1 costs, so
      #      the timing-sensitive reconnect test is not squeezed by contention.
      #   3. The spec is `test.describe.configure({ mode: "serial" })` at file
      #      scope, so tests still run in order WITHIN each project; only the
      #      projects themselves parallelize. Workspace names are already
      #      suffixed with `testInfo.project.name`, and GET /workspaces is
      #      unpaginated, so no project can hide another's row on the dashboard.
      # Keep `--workers` >= the project count in `e2e-projects`, or projects
      # queue and the saving disappears.
      #
      # That serial mode is LOAD-BEARING — do not delete it to chase more
      # parallelism. Measured against the real stack (clean DB, 3 projects):
      # serial ON @ 3 workers = 52.4s, 12 passed; serial OFF = 2 flaky @ 4
      # workers (1.2m), 3 flaky @ 6 (2.2m), failing @ 12. It is both slower and
      # unreliable, because `retries: 2` re-runs whatever it destabilises. The
      # per-project critical path (~174s on CI) is the floor for this step: the
      # 4 tests must run in order, and ~21s of that is the deterministic
      # provider's two 10.5s sleeps, which are deliberate — they are what push
      # the pipeline past its ~10s silent interval so the suite proves the real
      # SSE heartbeat contract. Shortening them deletes that coverage.
      - name: Docker-backed authenticated browser journeys
        run: pnpm exec playwright test e2e/authenticated-backend.spec.ts --workers=3 ${{ steps.e2e-projects.outputs.args }}

  marketing:
    name: Marketing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    if: needs.preflight.outputs.test_marketing == 'true'
    defaults:
      run:
        working-directory: apps/marketing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production-dependency audit (F8 — issue #42). Scoped to `--prod` and
      # `--audit-level high` because the marketing zone is `output: "static"`
      # (crawlable HTML, zero runtime JS): its risk is what ships, and dev-only
      # build tooling (Astro/Sanity CLI) carries transitive advisories with no
      # actionable bump, which `--prod` excludes. TruffleHog (the `secrets` job)
      # already scans apps/marketing repo-wide, so this only adds dep coverage.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Astro check
        run: pnpm check

      - name: Build
        # Smoke that the credential-free build (no Sanity creds in CI ⇒ homepage
        # + 5 hubs) compiles; the test suite re-builds fresh in its globalSetup,
        # but a clean build step attributes a compile break vs a test-assertion
        # failure without parsing the vitest log.
        run: pnpm build

      - name: Test (metadata / sitemap / robots / noindex / structured-data / GEO QA)
        # vitest globalSetup runs a fresh `astro build` (Sanity creds stripped),
        # then asserts the SEO/GEO contracts against the emitted dist — the
        # Phase-6 validation suite mapped 1:1 to the Phase-2..5 ACs.
        run: pnpm test

      - name: Install Sanity Studio dependencies
        run: pnpm --dir sanity install --frozen-lockfile

      # Studio suppressions live in `sanity/package.json` under
      # `pnpm.auditConfig.ignoreGhsas` — JSON can't hold a comment, so the
      # justification for each entry is in the commit that added it
      # (currently GHSA-mh99-v99m-4gvg, brace-expansion: only the 5.x line is
      # patched and forcing it breaks minimatch@5's CJS `expand` import; the
      # package is Sanity-CLI dev tooling and never ships).
      - name: Audit Sanity Studio dependencies
        run: pnpm --dir sanity audit --audit-level moderate

      - name: Typecheck Sanity Studio
        run: pnpm --dir sanity typecheck

      - name: Build Sanity Studio
        run: pnpm --dir sanity build

  deploy:
    name: Deploy
    needs: [preflight, backend, worker-image, frontend, marketing]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # Keep production deploys opt-in while the project is still in testing.
    # Set the repository variable PRODUCTION_DEPLOY_ENABLED=true after Railway
    # and Vercel projects/secrets are ready.
    #
    # backend/worker-image/frontend/marketing now each skip when their own
    # area didn't change (see the `preflight` job) — and also when preflight
    # proved the tree already passed CI on its PR. Either way this job's
    # default implicit `success()` gate — which treats a *skipped* need the
    # same as a *failed* one — would otherwise skip `deploy` entirely for e.g.
    # a marketing-only change (backend/frontend/worker-image all legitimately
    # skipped). `always()` plus explicit success-or-skipped checks below
    # restore the old "run unless something actually failed" behavior while
    # still hard-stopping on a real failure in any of them. `preflight` has no
    # path filter (always runs), so it stays a strict success requirement — and
    # its secret scan therefore still gates every deploy.
    #
    # Also skipped outright when NEITHER frontend nor marketing changed. Every
    # step in this job is already individually gated on one of those two
    # outputs, so on a backend-only push to main — the common case — the job
    # used to spin up a runner, check out the repo, evaluate five skipped steps,
    # and finish in ~6 seconds, for which a private repo is billed a full
    # minute. Railway is unaffected: it waits on this WORKFLOW's conclusion, and
    # a skipped job does not fail the run. This job never runs on
    # `pull_request`, so it cannot be a required PR status check either.
    if: >-
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      (needs.preflight.outputs.frontend == 'true' || needs.preflight.outputs.marketing == 'true') &&
      needs.preflight.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs['worker-image'].result == 'success' || needs['worker-image'].result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.marketing.result == 'success' || needs.marketing.result == 'skipped')
    # Map the optional marketing project id to a job-level env var so the
    # marketing deploy step can gate on it: the `secrets` context is NOT
    # available in step `if` conditions, but `env` is.
    env:
      VERCEL_MARKETING_PROJECT_ID: ${{ secrets.VERCEL_MARKETING_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Railway (backend + worker + worker-fast) is NOT deployed from here. All
      # three services are connected to `main` with
      # "Auto deploys when pushed to GitHub" + "Wait for CI" enabled, so Railway
      # builds each service itself once this workflow goes green. Each service
      # also carries config-as-code (`/backend/railway.json`,
      # `railway.worker.json`, and `railway.worker-fast.json`) plus root directory
      # `/backend`, all resolved *relative to the repo root* — which is exactly
      # why the old `railway up ./backend --path-as-root` step could never work:
      # it uploaded the backend folder AS the snapshot root, so Railway looked
      # for `/backend/railway.json` inside it and failed initialization. Do not
      # re-add a `railway up` step; it would also double-build every push
      # alongside the GitHub trigger. Ops (manual redeploy, rollback) is the
      # Railway dashboard — see docs/RUNBOOK.md.
      # No `working-directory: frontend` here: the Vercel project's own Root
      # Directory setting is already "frontend", resolved relative to cwd. CI
      # previously set both, so the CLI looked for frontend/frontend and
      # failed with "provided path does not exist" (run 30168097349). Deploy
      # from the repo root and let the project setting apply the subfolder.
      #
      # Gated on the `frontend` job having actually run (i.e. frontend/**
      # changed): the `deploy` job itself now runs even when frontend was
      # skipped (see the job-level `if:` above), so without this the CLI
      # would redeploy byte-identical frontend code on every marketing- or
      # backend-only push.
      - name: Deploy frontend to Vercel
        if: ${{ needs.preflight.outputs.frontend == 'true' }}
        run: |
          npm install -g vercel@56.4.1
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --project ${{ secrets.VERCEL_PROJECT_ID }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # SEO remediation plan T-2.1 (issue #18 follow-up): this used to be an
      # `if:` on the deploy step below that silently skipped when
      # VERCEL_MARKETING_PROJECT_ID was unset — that fail-open let the
      # marketing zone (apex, every SEO/GEO surface) go undeployed for the
      # entire period since go-live while CI stayed green. Hard-fail instead,
      # unless the opt-out is *explicitly* set. Placed AFTER "Deploy frontend
      # to Vercel", not before: an earlier version of this preflight ran first
      # in the job and, being a hard failure, aborted the whole step sequence
      # before the unrelated frontend/SPA deploy step ever ran — so a marketing
      # misconfiguration also blocked shipping the main app. Confirmed live on
      # `main` (run 30168097349): the frontend still deployed only because
      # Vercel's own Git integration deploys `thought2build` independently of
      # this workflow; the CI-driven deploy step itself never ran. This
      # ordering removes that coupling — a marketing config problem can no
      # longer take down the frontend deploy step even if that independent
      # safety net were ever disabled. Also gated on the `marketing` job
      # having actually run (apps/marketing/** changed) — a backend- or
      # frontend-only push must not hard-fail this job over an unrelated,
      # unconfigured marketing secret.
      - name: Assert marketing deploy is configured
        if: ${{ needs.preflight.outputs.marketing == 'true' && vars.MARKETING_DEPLOY_OPTIONAL != 'true' }}
        run: |
          if [ -z "${VERCEL_MARKETING_PROJECT_ID}" ]; then
            echo "::error::VERCEL_MARKETING_PROJECT_ID is unset — the marketing zone (apex, all SEO surfaces) would not deploy. Set the secret, or set the repo variable MARKETING_DEPLOY_OPTIONAL=true to explicitly skip it." >&2
            exit 1
          fi

      # Marketing zone — the primary (apex) Vercel project (issue #18, Phase 7).
      # Separate Vercel project from the SPA, so it uses its own project id
      # (VERCEL_MARKETING_PROJECT_ID). PUBLIC_SITE_URL must be set as a project
      # env var in Vercel (canonical/OG/sitemap base). This step still skips
      # when the id is unset, but that state is no longer silent: the "Assert
      # marketing deploy is configured" preflight above already hard-failed the
      # job unless MARKETING_DEPLOY_OPTIONAL=true was explicitly set (T-2.1).
      # No `working-directory: apps/marketing` here, same reasoning as the
      # frontend deploy step above: avoid double-applying the Vercel
      # project's own Root Directory setting on top of the shell cwd. Also
      # gated on `marketing` having actually run, same reasoning as the
      # frontend deploy step's gate.
      - name: Deploy marketing to Vercel
        if: ${{ needs.preflight.outputs.marketing == 'true' && env.VERCEL_MARKETING_PROJECT_ID != '' }}
        run: |
          npm install -g vercel@56.4.1
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --project ${{ secrets.VERCEL_MARKETING_PROJECT_ID }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MARKETING_PROJECT_ID }}

      # SEO remediation plan T-5.3 (issue #18): instant-submit the marketing
      # sitemap's URLs to IndexNow (Bing/Yandex) right after a live marketing
      # deploy, instead of waiting for the next crawl cycle. Gated identically
      # to the deploy step above, with no `always()` — a failed "Deploy
      # marketing to Vercel" step must skip this one too (default GitHub
      # Actions behavior), since submitting URLs for a deploy that didn't
      # actually ship would be worse than not submitting at all. Within that,
      # the script itself is non-fatal by design (always exits 0, reports
      # failures as `::warning::`) — a transient IndexNow/CDN-propagation
      # hiccup must never fail a deploy job that otherwise succeeded.
      - name: Notify IndexNow of updated marketing URLs
        if: ${{ needs.preflight.outputs.marketing == 'true' && env.VERCEL_MARKETING_PROJECT_ID != '' }}
        run: node apps/marketing/scripts/submit-indexnow.mjs
        env:
          INDEXNOW_SITE_URL: https://thought2build.com
          INDEXNOW_KEY: ef7228a2eede034338007049a8149ac2
