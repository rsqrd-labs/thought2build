name: policy-freshness
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - backend/services/pipeline/tech_safety_policy.json
      - backend/scripts/check_policy_freshness.py
      - .github/workflows/policy-freshness.yml
permissions:
  contents: read
jobs:
  review-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 backend/scripts/check_policy_freshness.py --warning-days 7
